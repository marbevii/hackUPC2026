<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Vols Disponibles - Mood</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='budget.css') }}">
    <style>
        /* Estils específics per netejar la interfície */
        .prompt-section {
            display: none !important; /* Elimina la secció del prompt/demo de dalt */
        }

        .country-options-grid {
            display: block !important; /* Passem de graella a bloc únic */
            margin-top: 20px;
        }

        .section-block {
            width: 100%;
            border: none !important;
            padding: 0 !important;
        }

        /* Amaguem les seccions que no siguin vols */
        .section-block:not(:first-child) {
            display: none !important;
        }

        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4f7fc;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .option-row:hover {
            background: #eef2f8;
        }

        .country-card {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .country-header h2 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .combo-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<header class="banner">
    <div class="banner-left">
        <div class="logo">LOGO</div>
        <h1>Nom Web</h1>
    </div>

    <div class="banner-right">
        <button class="icon-btn">♡</button>
        <button class="icon-btn">🛒</button>
        <button class="icon-btn">👤</button>
        <button class="icon-btn">☰</button>
    </div>
</header>

<main class="budget-page">

    <section class="countries-grid">

        {% for country in countries %}
        <article class="country-card">

            <div class="country-header">
                <h2>{{ country.city }}</h2>
                <p class="subtitle">{{ country.country }}</p>
                <p class="reason">{{ country.reason }}</p>
            </div>

            <div class="country-options-grid">
                <div class="section-block">
                    <h3>✈️ Vols disponibles</h3>
                    {% for item in country.flights %}
                    <label class="option-row">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <input type="radio" name="flight-{{ country.city }}" {% if loop.first %}checked{% endif %}>
                            <span>{{ item.airline if item.airline else item.name }}</span>
                        </div>
                        <strong>{{ item.price }}€</strong>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <button class="combo-btn">
                Triar millor combinació
            </button>

        </article>
        {% endfor %}

    </section>

</main>

</body>
</html>
